<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gallery – Amovis Cafe</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
}
body.dark{background:#0f172a;color:#e5e7eb}

header{
  background:linear-gradient(90deg,#7c3aed,#ec4899);
  color:#fff;
  padding:16px 24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.grid{
  padding:30px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:20px;
}

.card{
  background:white;
  border-radius:14px;
  overflow:hidden;
}
body.dark .card{background:#1e293b}

.card img,.card video{
  width:100%;
  height:220px;
  object-fit:cover;
  cursor:pointer;
}

/* Modal */
#modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:1000;
}
#modal img,#modal video{
  max-width:90vw;
  max-height:90vh;
  object-fit:contain; /* 🔥 ZOOM FIX */
  border-radius:16px;
}
#close{
  position:absolute;
  top:20px;
  right:30px;
  font-size:32px;
  color:white;
  cursor:pointer;
}
</style>
</head>

<body>

<header>
  <h2>Gallery</h2>
  <button onclick="toggleDark()">🌙</button>
</header>

<div id="grid" class="grid"></div>

<div id="modal" onclick="closeModal()">
  <span id="close">×</span>
  <div id="modalContent"></div>
</div>

<script>
/* Dark mode */
function toggleDark(){
  document.body.classList.toggle("dark");
  localStorage.setItem("amovis_dark",document.body.classList.contains("dark"));
}
if(localStorage.getItem("amovis_dark")==="true"){
  document.body.classList.add("dark");
}

/* Load gallery */
const media=JSON.parse(localStorage.getItem("amovis_gallery")||"[]");
const grid=document.getElementById("grid");

media.forEach(m=>{
  grid.innerHTML+=`
    <div class="card">
      ${m.type==="image"
        ? `<img src="${m.url}" onclick="openModal('image','${m.url}')">`
        : `<video src="${m.url}" onclick="openModal('video','${m.url}')"></video>`}
    </div>`;
});

/* Modal */
function openModal(type,url){
  document.getElementById("modal").style.display="flex";
  document.getElementById("modalContent").innerHTML=
    type==="image"
    ? `<img src="${url}">`
    : `<video src="${url}" controls autoplay></video>`;
}
function closeModal(){
  document.getElementById("modal").style.display="none";
  document.getElementById("modalContent").innerHTML="";
}
</script>

</body>
</html>
