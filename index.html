<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Welcome – Amovi's Cafe</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  height:100vh;
  background:#05050b;
  overflow:hidden;
  color:#fff;
}

/* ================= HEADER ================= */
header{
  width:100%;
  position:fixed;
  top:0;
  left:0;
  z-index:10;
  background:rgba(0,0,0,.6);
  backdrop-filter:blur(14px);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px 20px;
}

.brand{
  display:flex;
  align-items:center;
  gap:14px;
}

.logo{
  width:58px;
  height:58px;
  border-radius:50%;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:
    0 0 18px #a855f7,
    0 0 38px #7c3aed;
}

.logo img{
  width:70%;
}

.brand h1{
  font-size:20px;
  font-weight:800;
}

.skip{
  background:linear-gradient(90deg,#7c3aed,#ec4899);
  padding:8px 18px;
  border-radius:20px;
  cursor:pointer;
  font-size:12px;
}

/* ================= ADS ================= */
.ads-container{
  position:absolute;
  top:88px;
  left:0;
  width:100%;
  height:calc(100vh - 88px);
  overflow:hidden;
}

.ads-track{
  height:100%;
  transition:transform 1.2s ease-in-out;
}

/* ================= PAGE ================= */
.page{
  height:100%;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
  padding:18px;
}

.ad-box{
  width:100%;
  height:100%;
  border-radius:22px;
  overflow:hidden;
  position:relative;
  box-shadow:0 30px 90px rgba(0,0,0,.9);
}

/* IMAGE */
.ad-box img{
  width:100%;
  height:100%;
  object-fit:cover;
  animation:zoom 10s linear forwards;
}

@keyframes zoom{
  from{transform:scale(1);}
  to{transform:scale(1.12);}
}

/* VIDEO */
.ad-box video{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* ================= MOBILE ================= */
@media(max-width:900px){
  header{padding:12px 14px;}
  .brand h1{font-size:16px;}
  .logo{width:48px;height:48px;}
  .ads-container{
    top:78px;
    height:calc(100vh - 78px);
  }
  .page{
    grid-template-columns:1fr;
    padding:14px;
  }
}
</style>
</head>

<body>

<header>
  <div class="brand">
    <div class="logo">
      <img src="assets/logo.png">
    </div>
    <h1>Welcome to Amovi’s Cafe</h1>
  </div>
  <div class="skip" onclick="goHome()">Skip</div>
</header>

<div class="ads-container">
  <div class="ads-track" id="adsTrack"></div>
</div>

<!-- 🔥 Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
/* ================= FIREBASE CONFIG ================= */
const firebaseConfig = {
  apiKey: "AIzaSyBymiTjjqUN-AAspzoA_bOGUWOzEc9o3jA",
  authDomain: "amovis-cafe-booking.firebaseapp.com",
  projectId: "amovis-cafe-booking",
  appId: "1:1049074624404:web:35b18f7c0470939257d181"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* ================= LOGIC ================= */
const track = document.getElementById("adsTrack");
const isMobile = window.innerWidth < 900;
const ADS_PER_PAGE = isMobile ? 1 : 2;

let pages = [];
let pageIndex = 0;
let totalDuration = 0;

/* ================= LOAD ADS FROM FIRESTORE ================= */
db.collection("ads")
  .orderBy("createdAt","asc")
  .get()
  .then(snapshot=>{
    if(snapshot.empty){
      autoHome(30000);
      return;
    }

    const ads = [];
    snapshot.forEach(doc=>ads.push(doc.data()));

    for(let i=0;i<ads.length;i+=ADS_PER_PAGE){
      pages.push(ads.slice(i,i+ADS_PER_PAGE));
    }

    pages.forEach(group=>{
      const page=document.createElement("div");
      page.className="page";

      group.forEach(ad=>{
        const box=document.createElement("div");
        box.className="ad-box";

        if(ad.type==="video"){
          box.innerHTML=
            `<video src="${ad.url}" autoplay muted loop playsinline></video>`;
        }else{
          box.innerHTML=`<img src="${ad.url}">`;
        }

        box.onclick=()=>{
          const el=box.querySelector("video,img");
          if(el.requestFullscreen) el.requestFullscreen();
          if(el.tagName==="VIDEO"){
            el.muted=false;
            el.play();
          }
        };

        page.appendChild(box);
      });

      track.appendChild(page);
    });

    startAutoScroll();
  });

/* ================= AUTO SCROLL ================= */
function startAutoScroll(){
  const interval = setInterval(()=>{
    pageIndex++;
    if(pageIndex >= pages.length){
      clearInterval(interval);
      goHome();
      return;
    }
    track.style.transform =
      `translateY(-${pageIndex * 100}%)`;
  },10000);

  autoHome(pages.length * 10000);
}

/* ================= AUTO HOME ================= */
function autoHome(ms){
  setTimeout(goHome, ms);
}

function goHome(){
  location.href="home.html";
}
</script>

</body>
</html>
